[plugin]
enabled = true
config_version = "4"

[identity]
# 通常保持默认。route_scope 留空只匹配接入端未设置 scope 的会话。
adapter_namespace = "host-qq"
route_scope = ""

# 通过 WebUI 或本文件编辑名单，不提供消息写入命令。
# WebUI 保存后生效；直接编辑文件后重载插件。
# 每个身份一条，最多 200 条；同一 QQ 同一群范围不能重复。
[[identity.people]]
qq = "123456789"
nickname = "妈妈"
# 可留空；支持 {nickname}。
prompt_template = "与{nickname}自然亲近，可以撒娇，关心点到为止。"
# 留空适用于群聊和私聊；群专属条目优先于全局条目。
group_id = ""
# 示例停用，替换 QQ 后启用。
enabled = false

[management]
# 管理员 QQ 字符串数组，最多 16 人；留空无人获权。
# 用于 Vita 管理命令；Hush 选择 identity 来源时也使用此名单。固定身份不授予管理权。
admin_accounts = []

[context]
enabled = true
# 以下通常保持默认：提示字节数上限、消息作者缓存秒数。
budget_bytes = 2048
cache_ttl_seconds = 300
